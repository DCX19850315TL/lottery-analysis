[project]
name = "lottery-analysis"
version = "0.1.0"
# 锁定 3.10-3.12：torch / xgboost 对 Python 3.13+ 无稳定 CPU wheel
requires-python = ">=3.10,<3.13"
dependencies = [
    # 数据采集
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    # 数据处理
    "pandas==2.2.2",
    "numpy==1.26.4",
    # 统计检验
    "scipy==1.13.1",
    "statsmodels==0.14.2",
    # 机器学习
    "xgboost==2.1.1",
    "scikit-learn==1.5.1",
    # 深度学习（CPU 版，见 [tool.uv.sources]）
    "torch==2.3.1",
    # 界面
    "streamlit==1.37.1",
    "plotly==5.23.0",
    # Streamlit 表格序列化依赖；锁定 17.x 以兼容 numpy 1.26
    "pyarrow==17.0.0",
    # 配置
    "PyYAML==6.0.1",
    "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "hypothesis==6.108.5",
    "import-linter==2.0",
    "ruff==0.5.7",
    "mypy==1.11.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
